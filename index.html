<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi QR - SMPN 2 Warungkiara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-custom { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: none; }
    #reader { width: 100%; border-radius: 15px; overflow: hidden; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-3 shadow-sm">
    <div class="container text-center">
      <span class="navbar-brand font-weight-bold mx-auto">
        <strong>SMPN 2 WARUNGKIARA</strong> | Absensi QR Code
      </span>
    </div>
  </nav>

  <div class="container pb-5">
    <ul class="nav nav-pills mb-3 nav-justified bg-white p-2 rounded-3 shadow-sm" id="pills-tab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="tab-scan" data-bs-toggle="pill" data-bs-target="#pills-scan">📱 Scan QR</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-rekap" data-bs-toggle="pill" data-bs-target="#pills-rekap" onclick="loadRekap()">📊 Rekap Absensi</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-rank" data-bs-toggle="pill" data-bs-target="#pills-rank" onclick="loadRank()">🏆 Peringkat</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="tab-siswa" data-bs-toggle="pill" data-bs-target="#pills-siswa">👤 Kelola Siswa</button>
      </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
      <!-- TAB SCANNER KAMERA -->
      <div class="tab-pane fade show active" id="pills-scan">
        <div class="row justify-content-center">
          <div class="col-md-6 text-center">
            <div class="card card-custom p-3 bg-white">
              <h6 class="mb-2 text-primary font-weight-bold">Arahkan Kartu QR Ke Kamera HP</h6>
              <div id="reader"></div>
              <div id="scan-result" class="mt-3">
                <div class="alert alert-info py-2">Mempersiapkan Kamera HP...</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB REKAP -->
      <div class="tab-pane fade" id="pills-rekap">
        <div class="card card-custom p-3 bg-white">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="m-0 font-weight-bold">Data Rekap Absensi</h6>
            <select id="filterKelas" class="form-select w-auto form-select-sm" onchange="filterData()">
              <option value="">-- Semua Kelas --</option>
              <option value="VII A">7A</option><option value="VII B">7B</option><option value="VII C">7C</option><option value="VII D">7D</option>
              <option value="VIII A">8A</option><option value="VIII B">8B</option><option value="VIII C">8C</option><option value="VIII D">8D</option>
              <option value="IX A">9A</option><option value="IX B">9B</option><option value="IX C">9C</option><option value="IX D">9D</option>
            </select>
          </div>
          <div class="table-responsive">
            <table class="table table-striped text-center align-middle" id="tableRekap" style="font-size:0.85rem;">
              <thead class="table-dark">
                <tr><th>No</th><th>NISN</th><th>Nama</th><th>Kelas</th><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Status</th><th>Edit Status</th></tr>
              </thead>
              <tbody><tr><td colspan="9">Memuat data...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- TAB PERINGKAT -->
      <div class="tab-pane fade" id="pills-rank">
        <div class="row">
          <div class="col-md-6 mb-3">
            <div class="card card-custom p-3 bg-white border-start border-success border-4">
              <h6 class="text-success text-center font-weight-bold">🟢 SISWA PALING RAJIN</h6>
              <ol id="listRajin" class="list-group list-group-numbered mt-2"></ol>
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <div class="card card-custom p-3 bg-white border-start border-danger border-4">
              <h6 class="text-danger text-center font-weight-bold">🔴 SISWA SERING TERLAMBAT</h6>
              <ol id="listTerlambat" class="list-group list-group-numbered mt-2"></ol>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB KELOLA SISWA -->
      <div class="tab-pane fade" id="pills-siswa">
        <div class="row">
          <div class="col-md-5 mb-3">
            <div class="card card-custom p-3 bg-white">
              <h6 class="mb-3 font-weight-bold">Tambah Siswa Baru</h6>
              <input type="text" id="addNisn" class="form-control form-control-sm mb-2" placeholder="NISN">
              <input type="text" id="addNis" class="form-control form-control-sm mb-2" placeholder="NIS">
              <input type="text" id="addNama" class="form-control form-control-sm mb-2" placeholder="Nama Lengkap">
              <select id="addKelas" class="form-select form-select-sm mb-3">
                <option value="VII A">VII A</option><option value="VII B">VII B</option><option value="VII C">VII C</option><option value="VII D">VII D</option>
                <option value="VIII A">VIII A</option><option value="VIII B">VIII B</option><option value="VIII C">VIII C</option><option value="VIII D">VIII D</option>
                <option value="IX A">IX A</option><option value="IX B">IX B</option><option value="IX C">IX C</option><option value="IX D">IX D</option>
              </select>
              <button class="btn btn-primary btn-sm w-100" onclick="simpanSiswa()">Simpan Siswa</button>
            </div>
          </div>
          <div class="col-md-7">
            <div class="card card-custom p-3 bg-white text-center">
              <h6 class="mb-2 font-weight-bold">Cetak Kartu QR Siswa</h6>
              <input type="text" id="searchSiswaCard" class="form-control form-control-sm mb-3" placeholder="Ketik NISN Siswa..." onkeyup="previewCard()">
              <div id="cardPreviewArea" class="d-flex justify-content-center"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // GANTI TULISAN DI DALAM KUTIP INI DENGAN URL WEB APP APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycbyUwWrGqxMo7-x-zfYKirzdoNOPW9vfVfFS1tmlstQ0T3gYII-XAZF6HI0qHUr-r6ioEw/exec";

    let html5QrcodeScanner;
    let isProcessing = false;
    let allLogs = [];

    window.onload = function() {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } }, false);
      html5QrcodeScanner.render(onScanSuccess);
    };

    function onScanSuccess(decodedText) {
      if(isProcessing) return;
      isProcessing = true;

      document.getElementById("beepSound").play().catch(e=>{});
      document.getElementById("scan-result").innerHTML = `<div class="alert alert-info py-2">Memproses NISN: <strong>${decodedText}</strong>...</div>`;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "scan", nisn: decodedText })
      })
      .then(res => res.json())
      .then(res => {
        if(res.success) {
          let badgeClass = res.status === "Hadir" ? "bg-success" : "bg-danger";
          document.getElementById("scan-result").innerHTML = `
            <div class="alert alert-success py-2">
              <h6 class="m-0">✅ ${res.action} BERHASIL</h6>
              <small><strong>${res.nama}</strong> (${res.kelas})</small><br>
              <span class="badge ${badgeClass}">${res.status} - ${res.jam}</span>
            </div>`;
        } else {
          document.getElementById("scan-result").innerHTML = `<div class="alert alert-danger py-2">❌ ${res.message}</div>`;
        }
        setTimeout(() => {
          isProcessing = false;
          document.getElementById("scan-result").innerHTML = `<div class="alert alert-secondary py-2">Kamera siap memindai kartu berikutnya...</div>`;
        }, 2500);
      });
    }

    function loadRekap() {
      fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        allLogs = data.logs;
        renderTable(allLogs);
      });
    }

    function renderTable(logs) {
      let tbody = document.querySelector("#tableRekap tbody");
      tbody.innerHTML = "";
      if(!logs || logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-muted">Belum ada data.</td></tr>`;
        return;
      }
      logs.forEach((row, idx) => {
        tbody.innerHTML += `
          <tr>
            <td>${idx+1}</td>
            <td>${row[1]}</td>
            <td><strong>${row[3]}</strong></td>
            <td>${row[4]}</td>
            <td>${row[5]}</td>
            <td>${row[6]}</td>
            <td>${row[7]}</td>
            <td><span class="badge bg-primary">${row[8]}</span></td>
            <td>
              <select class="form-select form-select-sm" onchange="editStatus('${row[1]}', '${row[5]}', this.value)">
                <option value="">Edit</option>
                <option value="Hadir">Hadir</option>
                <option value="Sakit">Sakit</option>
                <option value="Izin">Izin</option>
                <option value="Alfa">Alfa</option>
                <option value="Terlambat">Terlambat</option>
              </select>
            </td>
          </tr>`;
      });
    }

    function filterData() {
      let k = document.getElementById("filterKelas").value;
      renderTable(!k ? allLogs : allLogs.filter(r => r[4] === k));
    }

    function editStatus(nisn, tgl, status) {
      if(!status) return;
      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateStatus", nisn: nisn, tanggal: tgl, status: status })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        loadRekap();
      });
    }

    function loadRank() {
      fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        let logs = data.logs;
        let cRajin = {}, cLate = {};
        logs.forEach(row => {
          let nama = row[3] + " (" + row[4] + ")";
          if(row[8] === 'Hadir') cRajin[nama] = (cRajin[nama]||0)+1;
          if(row[8] === 'Terlambat') cLate[nama] = (cLate[nama]||0)+1;
        });

        let sRajin = Object.keys(cRajin).sort((a,b)=>cRajin[b]-cRajin[a]);
        let sLate = Object.keys(cLate).sort((a,b)=>cLate[b]-cLate[a]);

        document.getElementById("listRajin").innerHTML = sRajin.slice(0,5).map(n=>`<li class="list-group-item d-flex justify-content-between align-items-center">${n} <span class="badge bg-success rounded-pill">${cRajin[n]} Hari</span></li>`).join('') || '<li class="list-group-item">Belum ada data</li>';
        document.getElementById("listTerlambat").innerHTML = sLate.slice(0,5).map(n=>`<li class="list-group-item d-flex justify-content-between align-items-center">${n} <span class="badge bg-danger rounded-pill">${cLate[n]} Kali</span></li>`).join('') || '<li class="list-group-item">Belum ada data</li>';
      });
    }

    function simpanSiswa() {
      let nisn = document.getElementById("addNisn").value;
      let nis = document.getElementById("addNis").value;
      let nama = document.getElementById("addNama").value;
      let kelas = document.getElementById("addKelas").value;

      if(!nisn || !nama) return alert("NISN dan Nama Wajib diisi!");

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "addSiswa", nisn: nisn, nis: nis, nama: nama, kelas: kelas })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        document.getElementById("addNisn").value = "";
        document.getElementById("addNama").value = "";
      });
    }

    function previewCard() {
      let nisn = document.getElementById("searchSiswaCard").value.trim();
      if(!nisn) return;
      let qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${nisn}`;
      document.getElementById("cardPreviewArea").innerHTML = `
        <div class="card p-3 text-center border-primary shadow-sm" style="width: 220px; border-radius: 15px;">
          <small class="fw-bold text-primary">SMPN 2 WARUNGKIARA</small>
          <img src="${qrUrl}" class="img-fluid mx-auto my-2" style="width:120px;">
          <small class="fw-bold">${nisn}</small>
        </div>`;
    }
  </script>
</body>
</html>
